[project]
name = "chiktsa-api"
version = "0.3.0"
description = "Chiktsa API: multi-household elderly-care coordination"
requires-python = ">=3.11"

[tool.ruff]
line-length = 130
target-version = "py311"
extend-exclude = [".venv", ".data"]

[tool.ruff.lint]
# pyflakes, pycodestyle, isort, bugbear, pyupgrade, simplify, bandit-lite
select = ["F", "E", "W", "I", "B", "UP", "SIM", "S"]
ignore = [
  "E501",   # long lines are handled by the formatter's judgement, not hard-wrapped
  "B008",   # FastAPI's Depends() in defaults is the framework idiom
  "SIM108", # ternaries are not always clearer
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S107", "S311"]   # asserts and fixture secrets are fine in tests
"scripts/**" = ["S105", "S106"]                 # documented demo-only password

[tool.pytest.ini_options]
testpaths = ["tests"]
